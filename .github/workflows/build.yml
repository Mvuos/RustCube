name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Распаковать проект из zip
        run: |
          if [ -f RustCube-part1.zip ]; then unzip -o RustCube-part1.zip || python3 -m zipfile -e RustCube-part1.zip .; fi
          ls -la
          ls -la RustCube

      - name: Подготовка Godot
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -v -p ~/.config
          if [ -d /root/.config/godot ]; then cp -r /root/.config/godot ~/.config/; fi
          ls -la ~/.config/godot || true

      - name: Debug keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore $GITHUB_WORKSPACE/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

      - name: Импорт ресурсов
        run: godot --headless --verbose --path RustCube --import || true

      - name: Сборка APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -v -p build
          godot --headless --verbose --path RustCube --export-debug "Android" $GITHUB_WORKSPACE/build/RustCube.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RustCube-apk
          path: build/RustCube.apk

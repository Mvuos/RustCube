name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Подготовка шаблонов экспорта
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Debug keystore и настройки Android
        run: |
          mkdir -p ~/.config/godot
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          SDK="${ANDROID_HOME:-/usr/lib/android-sdk}"
          JAVA_DIR="$(dirname $(dirname $(readlink -f $(which java))))"
          cat > ~/.config/godot/editor_settings-4.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${SDK}"
          export/android/java_sdk_path = "${JAVA_DIR}"
          export/android/debug_keystore = "$(pwd)/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          sed -i 's/^          //' ~/.config/godot/editor_settings-4.tres
          echo "SDK=$SDK JAVA=$JAVA_DIR"

      - name: Импорт ресурсов
        run: godot --headless --verbose --import || true

      - name: Сборка APK
        run: |
          mkdir -v -p build
          godot --headless --verbose --export-debug "Android" build/RustCube.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RustCube-apk
          path: build/RustCube.apk
